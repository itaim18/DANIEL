# Pi 5: steady SD writeback for REC ALL (~33 MB/s). The default dirty limits (20 % / 10 % of 8 GB) let
# ~1.6 GB pile up and then flush in a burst that blocked writers for 2-3 s: 39 IR + 22 RGB frames
# dropped in one 46 s test (2026-10-16). Small limits = continuous writeback, no stall.
#   sudo cp onboard/90-rec-all-writeback.conf /etc/sysctl.d/ && sudo sysctl --system
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
# a power cut loses at most ~5 s of recording (default 30 s; 2026-10-16 lost the last ~15-30 s)
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 100
