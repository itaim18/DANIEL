# Failsafe L1 -- install_failsafes.sh puts this at /etc/systemd/system.conf.d/99-hw-watchdog.conf
# (99: must sort after the Pi OS vendor 40-rpi-enable-watchdog.conf, which sets 1m). Checked by preflight.sh (RuntimeWatchdogUSec=10s).
# The PCA9685 latches its last pulse while the SoC is frozen (2026-07-21 runaway);
# the hardware watchdog (qcom_wdt on the Q6A, bcm2835-wdt on the Pi 5) reboots a
# frozen board in <=10 s and pwm-safe-boot.service then cuts the outputs.
# Until 2026-09-28 this file existed only on the Q6A (STATE.md trap 5).
[Manager]
RuntimeWatchdogSec=10
